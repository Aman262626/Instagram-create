<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG Account Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);padding:20px}
    .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:440px;overflow:hidden}
    .card-header{background:linear-gradient(135deg,#405de6,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);padding:32px 28px 24px;text-align:center;color:#fff}
    .card-header h1{font-size:24px;font-weight:700;margin-bottom:4px}
    .card-header p{font-size:13px;opacity:.85}
    .card-body{padding:28px}
    .step{display:none}
    .step.active{display:block}
    .step-indicator{display:flex;gap:8px;margin-bottom:24px;justify-content:center}
    .step-dot{width:10px;height:10px;border-radius:50%;background:#e0e0e0;transition:background .3s}
    .step-dot.done{background:#833ab4}
    .step-dot.current{background:#e1306c;box-shadow:0 0 0 3px rgba(225,48,108,.3)}
    label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:6px}
    input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;font-family:inherit;transition:border-color .2s;outline:none}
    input:focus{border-color:#833ab4}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;transition:transform .15s,opacity .15s;font-family:inherit}
    .btn-primary{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff}
    .btn-primary:hover{transform:translateY(-1px)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-outline{background:transparent;border:2px solid #e0e0e0;color:#333}
    .btn-outline:hover{border-color:#833ab4;color:#833ab4}
    .error-msg{color:#e1306c;font-size:13px;margin-top:8px;display:none}
    .error-msg.visible{display:block}
    .loader{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .result-box{background:#f8f9fa;border-radius:12px;padding:16px;margin-top:12px;word-break:break-all}
    .result-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
    .result-row:last-child{margin-bottom:0}
    .result-label{font-size:12px;font-weight:600;color:#833ab4;min-width:70px;flex-shrink:0}
    .result-value{font-size:14px;color:#333;font-family:'Courier New',monospace}
    .copy-btn{background:none;border:1px solid #ddd;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:#666;flex-shrink:0;margin-left:auto}
    .copy-btn:hover{border-color:#833ab4;color:#833ab4}
    .success-icon{font-size:48px;text-align:center;margin-bottom:12px}
    .step-title{font-size:17px;font-weight:600;color:#333;margin-bottom:16px;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>IG Account Creator</h1>
      <p>Create Instagram accounts in 3 simple steps</p>
    </div>
    <div class="card-body">
      <div class="step-indicator">
        <div class="step-dot current" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
        <div class="step-dot" id="dot-3"></div>
      </div>

      <!-- Step 1: Email -->
      <div class="step active" id="step-1">
        <div class="step-title">Enter Email Address</div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email" />
        <div class="error-msg" id="err-1"></div>
        <button class="btn btn-primary" id="btn-send" onclick="sendCode()">Send Verification Code</button>
      </div>

      <!-- Step 2: OTP -->
      <div class="step" id="step-2">
        <div class="step-title">Enter OTP Code</div>
        <p style="font-size:13px;color:#666;margin-bottom:14px;text-align:center" id="otp-hint"></p>
        <label for="otp">6-digit Code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
        <div class="error-msg" id="err-2"></div>
        <button class="btn btn-primary" id="btn-verify" onclick="verifyOtp()">Verify &amp; Create Account</button>
        <button class="btn btn-outline" onclick="restart()">Start Over</button>
      </div>

      <!-- Step 3: Result -->
      <div class="step" id="step-3">
        <div class="success-icon">&#127881;</div>
        <div class="step-title">Account Created!</div>
        <div class="result-box" id="result-box"></div>
        <button class="btn btn-primary" style="margin-top:20px" onclick="restart()">Create Another</button>
      </div>

      <!-- Error state -->
      <div class="step" id="step-error">
        <div class="success-icon">&#9888;&#65039;</div>
        <div class="step-title" id="err-title">Something Went Wrong</div>
        <p style="font-size:14px;color:#666;text-align:center" id="err-detail"></p>
        <button class="btn btn-primary" style="margin-top:20px" onclick="restart()">Try Again</button>
      </div>
    </div>
  </div>

  <script>
    let sessionToken = "";

    function showStep(n) {
      document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
      document.getElementById("step-" + n).classList.add("active");
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById("dot-" + i);
        dot.className = "step-dot";
        if (i < n) dot.classList.add("done");
        if (i === n) dot.classList.add("current");
      }
    }

    function showError(stepId, msg) {
      const el = document.getElementById(stepId);
      el.textContent = msg;
      el.classList.add("visible");
    }

    function clearErrors() {
      document.querySelectorAll(".error-msg").forEach(e => {
        e.textContent = "";
        e.classList.remove("visible");
      });
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.dataset.orig = btn.innerHTML;
        btn.innerHTML = '<span class="loader"></span>Please wait...';
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.orig || btn.innerHTML;
      }
    }

    function restart() {
      sessionToken = "";
      document.getElementById("email").value = "";
      document.getElementById("otp").value = "";
      clearErrors();
      showStep(1);
    }

    async function sendCode() {
      clearErrors();
      const email = document.getElementById("email").value.trim();
      if (!email) { showError("err-1", "Please enter an email."); return; }

      setLoading("btn-send", true);
      try {
        const res = await fetch("/api/send-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.ok) {
          sessionToken = data.session_token;
          document.getElementById("otp-hint").textContent =
            "A code was sent to " + email;
          showStep(2);
        } else {
          showError("err-1", data.error || "Failed to send code.");
        }
      } catch (e) {
        showError("err-1", "Network error. Please try again.");
      }
      setLoading("btn-send", false);
    }

    async function verifyOtp() {
      clearErrors();
      const otp = document.getElementById("otp").value.trim();
      if (!otp || otp.length < 6) { showError("err-2", "Enter the 6-digit code."); return; }

      setLoading("btn-verify", true);
      try {
        // Step A: verify OTP
        let res = await fetch("/api/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ otp, session_token: sessionToken }),
        });
        let data = await res.json();
        if (!data.ok) {
          showError("err-2", data.error || "OTP verification failed.");
          setLoading("btn-verify", false);
          return;
        }
        sessionToken = data.session_token;

        // Step B: create account
        res = await fetch("/api/create-account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_token: sessionToken }),
        });
        data = await res.json();
        if (data.ok) {
          renderResult(data);
          showStep(3);
        } else {
          document.getElementById("err-detail").textContent =
            data.error || "Account creation failed.";
          showStep("error");
        }
      } catch (e) {
        document.getElementById("err-detail").textContent =
          "Network error. Please try again.";
        showStep("error");
      }
      setLoading("btn-verify", false);
    }

    function renderResult(data) {
      const box = document.getElementById("result-box");
      box.innerHTML = row("Username", data.username) +
                      row("Password", data.password) +
                      row("Cookies", data.cookies);
    }

    function row(label, value) {
      const id = "val-" + label.toLowerCase();
      return '<div class="result-row">' +
        '<span class="result-label">' + label + '</span>' +
        '<span class="result-value" id="' + id + '">' + esc(value) + '</span>' +
        '<button class="copy-btn" onclick="copyText(\'' + id + '\')">Copy</button>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function copyText(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById(id)
          .closest(".result-row").querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1500);
      });
    }
  </script>
</body>
</html>
